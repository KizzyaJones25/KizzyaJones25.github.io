<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mrs. Kizzya Jones | Data Science Portfolio</title>

    <style>
        :root {
            --primary-blue: #6fa8dc;
            --dark-blue: #2f5f87;
            --light-blue: #eaf4fc;
            --background: #f8fbfe;
            --text-dark: #263442;
            --text-light: #5f6f7d;
            --white: #ffffff;
            --border: #d9e8f5;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            line-height: 1.7;
        }

        /* Navigation */

        nav {
            background-color: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            color: var(--dark-blue);
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            color: var(--text-dark);
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: var(--primary-blue);
        }

        /* Hero Section */

        .hero {
            background: linear-gradient(135deg, #dbeefe, #8fc1e8);
            min-height: 520px;
            padding: 90px 10%;
            display: flex;
            align-items: center;
        }

        .hero-content {
            max-width: 760px;
        }

        .hero-label {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.7);
            color: var(--dark-blue);
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .hero h1 {
            margin: 0;
            color: #244b6b;
            font-size: 56px;
            line-height: 1.15;
        }

        .hero h2 {
            margin: 14px 0 18px;
            color: var(--dark-blue);
            font-size: 25px;
            font-weight: normal;
        }

        .hero p {
            max-width: 680px;
            margin-bottom: 30px;
            color: #314b60;
            font-size: 19px;
        }

        .hero-button {
            display: inline-block;
            background-color: var(--dark-blue);
            color: var(--white);
            padding: 13px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
        }

        .hero-button:hover {
            background-color: #244b6b;
        }

        /* General Sections */

        section {
            max-width: 1100px;
            margin: auto;
            padding: 75px 30px;
        }

        .section-heading {
            margin-bottom: 30px;
        }

        .section-heading span {
            color: var(--primary-blue);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .section-heading h2 {
            margin: 5px 0 0;
            color: var(--dark-blue);
            font-size: 34px;
        }

        /* About */

        .about-container {
            background-color: var(--white);
            border-left: 6px solid var(--primary-blue);
            border-radius: 8px;
            padding: 35px;
            box-shadow: 0 6px 20px rgba(71, 107, 138, 0.08);
        }

        .about-container p {
            margin-top: 0;
            color: var(--text-light);
            font-size: 17px;
        }

        .about-container p:last-child {
            margin-bottom: 0;
        }

        /* Projects */

        #projects {
            background-color: var(--light-blue);
            max-width: none;
        }

        .projects-inner {
            max-width: 1100px;
            margin: auto;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }
